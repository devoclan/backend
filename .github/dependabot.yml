version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      # Major version bumps are reviewed manually, not auto-merged.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 10

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
